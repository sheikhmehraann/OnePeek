name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "ONEPEEK_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ONEPEEK_STORE_PASSWORD: ${{ secrets.ONEPEEK_STORE_PASSWORD }}
          ONEPEEK_KEY_ALIAS: ${{ secrets.ONEPEEK_KEY_ALIAS }}
          ONEPEEK_KEY_PASSWORD: ${{ secrets.ONEPEEK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/onepeek.keystore"
          STORE_PASS="${ONEPEEK_STORE_PASSWORD:-onepeek}"
          ALIAS_NAME="${ONEPEEK_KEY_ALIAS:-onepeek}"
          KEY_PASS="${ONEPEEK_KEY_PASSWORD:-onepeek}"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Restored release signing keystore from secret."
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=OnePeek, OU=Release, O=OnePeek, L=NA, ST=NA, C=US" > /dev/null 2>&1
            echo "Generated ephemeral release signing keystore."
          fi

          {
            echo "ONEPEEK_KEYSTORE_PATH=$KEYSTORE"
            echo "ONEPEEK_STORE_PASSWORD=$STORE_PASS"
            echo "ONEPEEK_KEY_ALIAS=$ALIAS_NAME"
            echo "ONEPEEK_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Run checks, tests, and assemble APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessCheck :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            --parallel \
            --build-cache \
            --max-workers="$(nproc)"

      - name: Verify APKs and build release assets
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RELEASE_APK"
          test -f "$DEBUG_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/java_init.list"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/module.prop"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/scope.list"

          RELEASE_NAME="OnePeek-${TAG}-release.apk"
          DEBUG_NAME="OnePeek-${TAG}-debug.apk"

          mkdir -p dist
          cp "$RELEASE_APK" "dist/${RELEASE_NAME}"
          cp "$DEBUG_APK" "dist/${DEBUG_NAME}"
          (cd dist && sha256sum "${RELEASE_NAME}" "${DEBUG_NAME}" > SHA256SUMS.txt)

          RELEASE_SHA256="$(sha256sum "dist/${RELEASE_NAME}" | awk '{print $1}')"
          DEBUG_SHA256="$(sha256sum "dist/${DEBUG_NAME}" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION_CODE="$(git rev-list --count HEAD)"

          CHANGELOG_SECTION="$(awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"

          {
            echo "## OnePeek ${TAG}"
            echo ""
            if [ -n "${CHANGELOG_SECTION}" ]; then
              printf '%s\n\n' "${CHANGELOG_SECTION}"
            fi
            echo "### Build Metadata"
            echo ""
            echo "- Version: \`${VERSION}\` (versionCode \`${VERSION_CODE}\`)"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- Target package: \`com.google.android.apps.subscriptions.red\`"
            echo "- Framework: libxposed API \`102\`"
            echo ""
            echo "### Assets and SHA-256 Checksums"
            echo ""
            echo "| File | SHA-256 |"
            echo "| :--- | :--- |"
            echo "| \`${RELEASE_NAME}\` | \`${RELEASE_SHA256}\` |"
            echo "| \`${DEBUG_NAME}\` | \`${DEBUG_SHA256}\` |"
            echo ""
            echo "Checksum manifest attached as \`SHA256SUMS.txt\`."
          } > dist/RELEASE_NOTES.md

          {
            echo "release_name=${RELEASE_NAME}"
            echo "debug_name=${DEBUG_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OnePeek-${{ steps.tag.outputs.tag }}
          path: |
            dist/${{ steps.package.outputs.release_name }}
            dist/${{ steps.package.outputs.debug_name }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OnePeek ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          draft: false
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.package.outputs.release_name }}
            dist/${{ steps.package.outputs.debug_name }}
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
