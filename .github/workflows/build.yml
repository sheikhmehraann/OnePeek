name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ONEPEEK_STORE_PASSWORD: ${{ secrets.ONEPEEK_STORE_PASSWORD }}
          ONEPEEK_KEY_ALIAS: ${{ secrets.ONEPEEK_KEY_ALIAS }}
          ONEPEEK_KEY_PASSWORD: ${{ secrets.ONEPEEK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/onepeek.keystore"

          STORE_PASS="${ONEPEEK_STORE_PASSWORD:-onepeek}"
          ALIAS_NAME="${ONEPEEK_KEY_ALIAS:-onepeek}"
          KEY_PASS="${ONEPEEK_KEY_PASSWORD:-onepeek}"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Restored signing keystore from repository secret."
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=OnePeek, OU=Release, O=OnePeek, L=NA, ST=NA, C=US" > /dev/null 2>&1
            echo "Generated ephemeral release signing keystore."
          fi

          {
            echo "ONEPEEK_KEYSTORE_PATH=$KEYSTORE"
            echo "ONEPEEK_STORE_PASSWORD=$STORE_PASS"
            echo "ONEPEEK_KEY_ALIAS=$ALIAS_NAME"
            echo "ONEPEEK_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and assemble APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            --parallel \
            --build-cache \
            --max-workers="$(nproc)"

      - name: Verify APK signatures and Xposed metadata
        run: |
          set -euo pipefail
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RELEASE_APK"
          test -f "$DEBUG_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/java_init.list"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/module.prop"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/scope.list"

          VERSION_CODE="$(git rev-list --count HEAD)"
          VERSION_NAME="1.${VERSION_CODE}"
          RELEASE_NAME="OnePeek-v${VERSION_NAME}-release.apk"
          DEBUG_NAME="OnePeek-v${VERSION_NAME}-debug.apk"

          mkdir -p dist
          cp "$RELEASE_APK" "dist/${RELEASE_NAME}"
          cp "$DEBUG_APK" "dist/${DEBUG_NAME}"

          RELEASE_SHA256="$(sha256sum "dist/${RELEASE_NAME}" | awk '{print $1}')"
          DEBUG_SHA256="$(sha256sum "dist/${DEBUG_NAME}" | awk '{print $1}')"

          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "release_name=${RELEASE_NAME}"
            echo "debug_name=${DEBUG_NAME}"
            echo "release_sha256=${RELEASE_SHA256}"
            echo "debug_sha256=${DEBUG_SHA256}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## OnePeek Build Output"
            echo ""
            echo "- Version: \`${VERSION_NAME}\` (code \`${VERSION_CODE}\`)"
            echo "- Release APK: \`${RELEASE_NAME}\` (\`${RELEASE_SHA256}\`)"
            echo "- Debug APK: \`${DEBUG_NAME}\` (\`${DEBUG_SHA256}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
        id: package

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePeek-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.package.outputs.version_name) }}
          name: OnePeek v${{ steps.package.outputs.version_name }}
          body: |
            Automated build from commit `${{ github.sha }}`.

            - Release APK: `${{ steps.package.outputs.release_name }}`
              SHA-256: `${{ steps.package.outputs.release_sha256 }}`
            - Debug APK: `${{ steps.package.outputs.debug_name }}`
              SHA-256: `${{ steps.package.outputs.debug_sha256 }}`
          files: |
            dist/${{ steps.package.outputs.release_name }}
            dist/${{ steps.package.outputs.debug_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
