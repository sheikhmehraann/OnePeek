name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and Verify APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ONEPEEK_STORE_PASSWORD: ${{ secrets.ONEPEEK_STORE_PASSWORD }}
          ONEPEEK_KEY_ALIAS: ${{ secrets.ONEPEEK_KEY_ALIAS }}
          ONEPEEK_KEY_PASSWORD: ${{ secrets.ONEPEEK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/onepeek.keystore"
          STORE_PASS="${ONEPEEK_STORE_PASSWORD:-onepeek}"
          ALIAS_NAME="${ONEPEEK_KEY_ALIAS:-onepeek}"
          KEY_PASS="${ONEPEEK_KEY_PASSWORD:-onepeek}"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=OnePeek, OU=CI, O=OnePeek, L=NA, ST=NA, C=US" > /dev/null 2>&1
          fi

          {
            echo "ONEPEEK_KEYSTORE_PATH=$KEYSTORE"
            echo "ONEPEEK_STORE_PASSWORD=$STORE_PASS"
            echo "ONEPEEK_KEY_ALIAS=$ALIAS_NAME"
            echo "ONEPEEK_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Run formatting, unit tests, and APK build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessCheck :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            --parallel \
            --build-cache \
            --max-workers="$(nproc)"

      - name: Verify APK signatures and Xposed metadata
        run: |
          set -euo pipefail
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$RELEASE_APK"
          test -f "$DEBUG_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/java_init.list"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/module.prop"
          unzip -l "$RELEASE_APK" | grep -q "META-INF/xposed/scope.list"

          SHORT_SHA="$(git rev-parse --short HEAD)"
          mkdir -p dist
          cp "$RELEASE_APK" "dist/OnePeek-${SHORT_SHA}-release.apk"
          cp "$DEBUG_APK" "dist/OnePeek-${SHORT_SHA}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OnePeek-CI-APKs
          path: dist/*
          retention-days: 7
          if-no-files-found: error
